<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fafafa"><title>日迹 · 日历记账</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="themes.css"><link rel="stylesheet" href="product.css"><script src="theme-init.js"></script><link rel="stylesheet" href="components.css"><link rel="stylesheet" href="depth.css"><link rel="stylesheet" href="motion.css"><link rel="stylesheet" href="ledger.css"></head><body>
<header class="app-header"><a class="brand" href="#"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 5h14v15H5zM8 3v4m8-4v4M5 10h14m-9 4h4m-4 3h2"/></svg></span>日迹</a><nav aria-label="账本视图"><button class="nav-item active" data-view="calendar">日历</button><button class="nav-item" data-view="records">明细</button><button class="nav-item" data-view="insights">分析</button></nav><div class="header-actions"><select id="theme" aria-label="配色方案" title="配色方案"><option value="original">默认</option><option value="muelsyse">缪尔赛思</option><option value="surtr">史尔特尔</option><option value="logos">逻各斯</option></select><button id="export-btn" class="icon-button" title="导出备份" aria-label="导出备份"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m-4 4 4-4 4 4M5 14v6h14v-6"/></svg></button><button id="import-btn" class="icon-button" title="导入备份" aria-label="导入备份"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-4-4 4 4 4-4M5 14v6h14v-6"/></svg></button><input type="file" id="import-file" accept=".json,application/json" hidden></div></header>
<main><div class="month-toolbar"><div class="month-picker"><h1 id="month-title"></h1><div class="month-arrows"><button id="prev" aria-label="上个月"><svg viewBox="0 0 24 24"><path d="m14 7-5 5 5 5"/></svg></button><button id="next" aria-label="下个月"><svg viewBox="0 0 24 24"><path d="m10 7 5 5-5 5"/></svg></button></div><button id="today-btn" class="today-button">本月</button></div><div class="toolbar-actions"><button class="primary" id="add-btn"><span>＋</span> 记一笔</button></div></div>
<details id="summary-disclosure" class="summary-disclosure" open><summary><span id="summary-title">本月收支</span><span id="summary-preview"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></summary><section id="monthly-totals" class="monthly-summary" aria-label="月度汇总"></section></details>
<div id="calendar-view" class="workspace"><section class="calendar-panel" aria-label="收支日历"><div class="weekdays"><span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>周日</span></div><div id="calendar" class="calendar"></div></section><aside class="day-panel"><div class="day-header"><div><p id="selected-weekday"></p><h2 id="selected-title"></h2></div><button class="small-add" id="day-add" aria-label="为这一天记一笔">＋</button></div><section class="preset-section"><div class="section-toolbar"><h3>每日支出 <span id="preset-status" class="progress-count"></span></h3><button id="manage-presets" class="text-button">编辑预设</button></div><div class="daily-progress" id="daily-progress" role="progressbar" aria-label="每日支出已记录项目" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0"><span></span></div><form id="daily-form"><div id="daily-presets"></div><div class="daily-footer"><span id="daily-hint"></span><button type="submit" class="primary">保存支出</button></div></form></section><section class="transactions"><div class="section-toolbar"><h3>当日明细</h3><span id="day-count" class="muted"></span></div><div id="day-records"></div></section></aside></div>
<section id="records-view" class="surface" aria-label="收支明细" hidden><div class="panel-header"><input type="search" id="search" placeholder="搜索备注或分类" aria-label="搜索明细"><select id="record-currency-filter" aria-label="筛选币种"><option value="all">全部币种</option><option value="USD">USD</option><option value="CNY">CNY</option></select><select id="type-filter" aria-label="筛选类型"><option value="all">全部类型</option><option value="expense">支出</option><option value="income">收入</option></select></div><div id="all-records"></div></section>
<section id="insights-view" class="surface" hidden><div id="category-bars"></div></section></main>
<dialog id="entry-dialog"><form id="entry-form"><div class="dialog-heading"><h2 id="dialog-title">记一笔</h2><button type="button" id="close-dialog" class="icon-button" aria-label="关闭">×</button></div><div class="type-toggle"><label><input type="radio" name="type" value="expense" checked><span>支出</span></label><label><input type="radio" name="type" value="income"><span>收入</span></label></div><div class="amount-fields"><label class="field">币种<select id="entry-currency" aria-label="币种"><option value="USD">USD · 美元</option><option value="CNY">CNY · 人民币</option></select></label><label class="field">金额<input id="amount" aria-label="金额" type="number" min="0.01" max="999999999" step="0.01" required placeholder="0.00" inputmode="decimal"></label></div><div class="form-grid"><label class="field">日期<input id="date" aria-label="日期" type="date" min="1900-01-01" max="9999-12-31" required></label><label class="field">分类<select id="category" aria-label="分类"></select></label></div><label class="field">备注<input id="note" aria-label="备注" maxlength="100" placeholder="选填"></label><div class="dialog-footer"><button type="button" id="delete-btn" class="danger" hidden>删除记录</button><button type="submit" class="primary">保存</button></div></form></dialog><dialog id="presets-dialog"><form id="presets-form"><div class="dialog-heading"><h2>每日支出预设</h2><button type="button" id="close-presets" class="icon-button" aria-label="关闭预设">×</button></div><div id="preset-editor"></div><button type="button" id="new-preset" class="text-button">＋ 添加项目</button><div class="dialog-footer"><button type="submit" class="primary">保存预设</button></div></form></dialog><div id="toast" role="status"></div><script src="app.js"></script><script src="themes.js"></script><script src="interactions.js"></script><script src="components.js"></script><script src="fx.js"></script><script src="insights.js"></script><script src="ledger.js"></script><script src="motion.js"></script></body></html>
